<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <script src="calculo.js" defer></script>
    <link rel="stylesheet" href="   calculo.css">
</head>

<body>
    <header>
        <p>Laboratório Front-end</p>
    </header>

    <div class="banner">
        <h1>Calculadora de Notas</h1>
        <h3>Calcular média</h3>
    </div>

    <div class="calculo">
        <div class="notas">
            <p>Informe as notas (de 0 a 10)</p>
            <br>
            <table>
                <tr>
                    <th>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" >
                    </th>
                    <th>
                        <label for="disciplina">Disciplina:</label>
                        <input type="text" id="disciplina" >
                    </th>
                </tr>
                <tr>
                    <th>
                        <label for="nota1">Nota 1:</label>
                        <input type="number" id="nota1">
                    </th>
                    <th>
                        <label for="nota2">Nota 2:</label>
                        <input type="number" id="nota2">
                    </th>
                </tr>
                <tr>
                    <th>
                        <label for="nota3">Nota 3:</label>
                        <input type="number" id="nota3">
                    </th>
                    <th>
                        <label for="nota4">Nota 4:</label>
                        <input type="number" id="nota4">
                    </th>
                </tr>
            </table>

            <button onclick="calcular()">Calcular</button>
        </div>

        <div class="resultado">
            <h1>Resultado do Cálculo</h1>
            <p id="nomeD"></p>
            <p id="disciplinaD"></p>
            <p id="notas"></p>
            <p>Média final:</p>
            <p id="media"></p>
        </div>
    </div>
</body>

</html>

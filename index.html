<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <p>Laboratorio Front-end</p>
    </header>

    <div class="banner">
        <h1>Calculadora de notas</h1>
        <h3>Calcular media</h3>
    </div>

    <div class="calculo">
        <div class="notas">
            <P>informe as notas (de 0 a 10)</P>
            <br>
            <table>
                <tr>
                    <th>
                        <label>Nome:</label>
                        <input type="text" required id="nome">
                    </th>
                    <th>
                        <label>Nota 1</label>
                        <input type="text" required id="nota1">
                    </th>
                    <th>
                        <label>Nota 3</label>
                        <input type="text" required id="nota3">
                    </th>
                </tr>
                <tr>
                    <th>
                        <label>Disciplina:</label>
                        <input type="text" required id="disciplina">
                    </th>
                    <th>
                        <label>Nota 2</label>
                        <input type="text" required id="nota2">
                    </th>
                    <th>
                        <label>Nota 4</label>
                        <input type="text" required id="nota4">
                    </th>
                </tr>
            </table>



        </div>

        <div class="resultado">


        </div>
    </div>
</body>

</html>
